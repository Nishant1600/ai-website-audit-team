    <text x="0" y="222" font-size="52" font-weight="800" fill="url(#title)">hired a company.</text>

    <text x="0" y="276" font-size="22" fill="#cbd5e1">10 AI specialists · 5 supervisors · 1 CEO who reports to you</text>
    <text x="0" y="318" font-size="17" fill="#94a3b8">Finds bugs. Proves them. Fixes them. Verifies the fix. Twice.</text>
  </g>

